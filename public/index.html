<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f3d2e">
  <title>カジノゲーム集</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <button id="mute" class="mutebtn" aria-label="効果音のオン/オフ">🔊</button>
  <div id="conn" class="conn hidden">接続が切れました。再接続しています…</div>

  <main id="home" class="panel">
    <h1>🎰 カジノゲーム集 <small>ONLINE</small></h1>
    <p class="sub">トランプ（大富豪・7並べ・ババ抜き・神経衰弱・ダウト）とカジノ（ブラックジャック・ルーレット・大小・スロット・チンチロ）。URLを送るだけで友達と遊べます（CPUも参加可）。チップは遊び用で、お金は一切かかりません</p>
    <label class="field-label">ニックネーム
      <input id="name" maxlength="10" placeholder="ユーザー" autocomplete="off">
    </label>
    <button id="btn-create" class="btn primary big">ルームを作る</button>
    <div class="or">または 招待コードで入る</div>
    <div class="row">
      <input id="code" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off">
      <button id="btn-join" class="btn big">入室</button>
    </div>
    <p id="home-msg" class="msg"></p>
  </main>

  <main id="lobby" class="panel hidden"></main>
  <main id="game" class="hidden"></main>

  <div id="overlay" class="hidden"></div>
  <canvas id="confetti" class="confetti"></canvas>
  <div id="banner" class="banner"></div>
  <div id="toast" class="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
